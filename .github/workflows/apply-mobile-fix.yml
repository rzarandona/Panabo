name: Apply mobile layout fix

on:
  push:
    paths:
      - .github/mobile-fix-trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply tested mobile patch
        run: python tools/apply_mobile_fix.py

      - name: Commit updated presentation
        run: |
          if git diff --quiet -- index.html; then
            echo "No index.html changes were required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix mobile swipe presentation layout"
          git push
