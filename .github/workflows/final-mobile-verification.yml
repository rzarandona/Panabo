name: Final mobile presentation verification

on:
  push:
    paths:
      - .github/final-mobile-verify-trigger

permissions:
  contents: write

jobs:
  viewport-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Check out final repository state
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright and Chromium
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          CHROMIUM_PATH=$(python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              print(p.chromium.executable_path)
          PY
          )
          sudo ln -sf "$CHROMIUM_PATH" /usr/bin/chromium

      - name: Run final viewport regression suite
        run: python tests/mobile_layout_test.py

      - name: Record final successful verification
        run: |
          mkdir -p verification
          printf 'Final mobile layout viewport suite passed for commit %s\n' "$GITHUB_SHA" > verification/final-mobile-layout-passed.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add verification/final-mobile-layout-passed.txt
          git commit -m "Record final mobile layout verification"
          git push
