<!doctype html>
<html lang='en'>
<head>
<meta charset='utf-8'>
<meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'>
<meta name='theme-color' content='#092f52'>
<title>Panabo Digital Permit Pilot</title>
<link rel='stylesheet' href='styles.css'>
<script src='app.js' defer></script>
</head>
<body>
<main class='app'>
<header class='bar'><div class='brand'><div class='logo'>P</div><div><b>Panabo Digital Permit Pilot</b><small>Interactive concept proposal · English</small></div></div><button class='btn' id='print' aria-label='Print or save as PDF'>⎙ <span>Print / PDF</span></button></header>
<section class='stage'><div class='deck' id='deck'><div class='loading'>Loading presentation…</div></div></section>
<nav class='controls' aria-label='Presentation navigation'><div class='counter' id='counter' aria-live='polite'>01 / 15</div><div><div class='progress' aria-hidden='true'><i id='bar'></i></div><div class='dots' id='dots'></div></div><div class='navs'><button class='nav' id='prev' aria-label='Previous slide'>← <span>Back</span></button><button class='nav' id='next' aria-label='Next slide'><span>Next</span> →</button></div></nav>
<noscript>This presentation requires JavaScript.</noscript>
</main>
</body>
</html>
